<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Usage</title>
    <script type="module" src="./dashboard.ts"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Agent Usage</p>
          <h1>Rate limit dashboard</h1>
          <p id="status" class="status">Loading live usage...</p>
        </div>
        <button id="refresh" class="icon-button" title="Refresh usage" aria-label="Refresh usage">
          <span aria-hidden="true">↻</span>
        </button>
      </header>
      <section id="hook-settings" class="settings-row" aria-live="polite"></section>
      <section id="web-cookie-settings" class="settings-row" aria-live="polite"></section>
      <section id="rings" class="ring-grid" aria-label="Usage rings"></section>
      <section class="panels">
        <div>
          <h2>Burn rate</h2>
          <div id="burn-rates" class="metric-list"></div>
        </div>
        <div class="history-panel">
          <div class="panel-head">
            <h2>7 day history</h2>
            <div id="history-legend" class="legend"></div>
          </div>
          <p class="panel-sub">Tokens per day (JST), from local session logs</p>
          <div id="history" class="history-chart" role="img" aria-label="Daily token usage for the last 7 days"></div>
          <div id="history-tooltip" class="chart-tooltip" role="tooltip" hidden></div>
        </div>
      </section>
    </main>
  </body>
</html>
