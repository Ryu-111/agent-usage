[package]
name = "agent-usage"
version = "0.1.0"
description = "Claude Code and Codex rate-limit usage HUD"
authors = ["ryu"]
edition = "2021"

[lib]
name = "agent_usage"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
anyhow = "1"
aes = "0.9"
cbc = "0.2"
chrono = { version = "=0.4.45", features = ["serde"] }
dirs = "=6.0.0"
glob = "0.3"
portable-pty = "0.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
security-framework = "=3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.0.0", features = ["macos-private-api", "tray-icon"] }
tauri-codegen = "=2.0.0"
tauri-macros = "=2.0.0"
tauri-runtime = "=2.0.0"
tauri-runtime-wry = "=2.0.0"
tauri-utils = "=2.4.0"
thiserror = "=2.0.18"
time = "=0.3.55"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
url = "=2.5.8"
idna_adapter = "=1.2.2"
indexmap = "=2.14.2"
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "webpki-roots"] }
pbkdf2 = "0.13"
sha1 = "0.11"
unicode-segmentation = "=1.13.3"
uuid = "=1.28.0"

[dev-dependencies]
tempfile = "=3.27.0"
