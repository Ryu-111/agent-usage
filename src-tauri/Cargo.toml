[package]
name = "agent-usage"
version = "0.1.0"
description = "Claude Code and Codex rate-limit usage HUD"
authors = ["ryu"]
edition = "2021"

[lib]
name = "agent_usage"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "=0.4.38", features = ["serde"] }
dirs = "=5.0.1"
glob = "0.3"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
security-framework = "=3.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.0.0", features = ["macos-private-api", "tray-icon"] }
tauri-codegen = "=2.0.0"
tauri-macros = "=2.0.0"
tauri-runtime = "=2.0.0"
tauri-runtime-wry = "=2.0.0"
tauri-utils = "=2.0.0"
thiserror = "=1.0.69"
time = "=0.3.36"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
url = "=2.5.4"
idna_adapter = "=1.0.0"
indexmap = "=2.6.0"
hyper-rustls = { version = "=0.27.5", default-features = false, features = ["http1", "tls12", "webpki-roots"] }
unicode-segmentation = "=1.12.0"
uuid = "=1.10.0"

[dev-dependencies]
tempfile = "=3.10.1"
